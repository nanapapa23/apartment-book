<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 관리자</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">⚙️ 도서 관리자</div>
    <div class="card">
        <input id="title" placeholder="도서명">
        <input id="author" placeholder="저자">
        <select id="category"><option>성인</option><option>청소년</option><option>어린이</option><option>자기개발</option><option>기타</option></select>
        <button id="saveBtn" class="btn-primary">도서 등록</button>
        <hr style="margin:20px 0;">
        <button id="downloadBtn" class="btn-sub">CSV 다운로드</button>
        <input type="file" id="uploadFile" accept=".csv" style="margin-top:10px;">
        <button id="uploadBtn" class="btn-primary" style="margin-top:10px;">CSV 대량 업로드</button>
    </div>
    <div id="adminList"></div>
    <script type="module" src="admin.js"></script>
</body>
</html>
