<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 관리자 모드</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if(sessionStorage.getItem("libraryAdmin") !== "true") {
            alert("관리자 전용 페이지입니다.");
            window.location.href = "index.html";
        }
    </script>
</head>
<body style="background:#f5f5f5; padding:20px;">

<div style="text-align:center; margin-bottom:20px;">
    <h2>📚 도서 관리자 모드</h2>
    <button id="logoutBtn" style="padding:10px 20px; border-radius:10px; border:none; background:#d32f2f; color:white; cursor:pointer;">로그아웃</button>
</div>

<div class="book"> <h3>신규 도서 등록</h3>
    <input id="title" placeholder="도서명" style="width:100%; padding:10px; margin:10px 0;">
    <input id="author" placeholder="저자" style="width:100%; padding:10px; margin-bottom:10px;">
    <select id="category" style="width:100%; padding:10px; margin-bottom:10px;">
        <option>성인</option><option>청소년</option><option>어린이</option><option>자기개발</option><option>기타</option>
    </select>
    <label><input type="checkbox" id="newbook"> 신간 도서 체크</label>
    <button id="saveBtn" style="width:100%; padding:15px; margin-top:10px; background:#1976d2; color:white; border:none; border-radius:10px;">도서 추가</button>
</div>

<div class="section-title">도서 목록 관리</div>
<div id="adminList"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
