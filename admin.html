<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>관리자 모드</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="admin-header">

<div>

<h1>관리자 모드</h1>

<p>
도서 등록 및 관리
</p>

</div>

<button id="logoutBtn"
class="logout-btn">

로그아웃

</button>

</div>

<!-- 등록 카드 -->

<div class="admin-card">

<h2>
도서 등록 / 수정
</h2>

<input id="title" placeholder="도서명">
<input id="author" placeholder="저자">
<input id="publisher" placeholder="출판사"> 
<input id="imgUrl" placeholder="표지 이미지 URL">

<input
type="date"
id="regDate">

<select id="category">

<option value="">
카테고리 선택
</option>

<option value="성인">
성인
</option>

<option value="청소년">
청소년
</option>

<option value="어린이">
어린이
</option>

<option value="자기개발">
자기개발
</option>

<option value="기타">
기타
</option>

</select>

<div class="row">
    <select id="shelf">
        <option value="A">A</option><option value="B">B</option><option value="C">C</option>
        <option value="D">D</option><option value="E">E</option><option value="F">F</option>
        <option value="G">G</option><option value="H">H</option><option value="I">I</option>
        <option value="J">J</option>
        <option value="어린이전용">어린이전용</option>
    </select>
    <select id="slot">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
    </select>
</div>

<label class="newbook-check">

<input
type="checkbox"
id="newbook">

신간 도서

</label>

<button
id="saveBtn"
class="save-btn">

저장

</button>

</div>

<!-- 데이터 관리 -->

<div class="admin-card">

<h2>
데이터 관리
</h2>

<input
type="file"
id="csvFile"
style="display:none;">

<button
class="upload-btn"
onclick="
document.getElementById('csvFile').click()
">

CSV 업로드

</button>

<button
id="downloadBtn"
class="download-btn">

CSV 다운로드

</button>
    
<button id="deleteAllBtn" class="delete-btn" style="background-color: #ff4444; color: white;">전체 데이터 삭제</button>
</div>

  <div class="admin-card">

<h2>도서 현황</h2>

<div id="bookStats">

로딩중...

</div>

</div>

<!-- 목록 -->

<div class="admin-card">
    <h2>도서 검색</h2>
    <input type="text" id="adminSearch" placeholder="제목/저자/초성 검색...">
</div>

<div class="admin-card">
    <h2>도서 목록</h2>
    <div id="adminList"></div>
</div>

</div>

<script type="module"
src="admin.js"></script>

</body>
</html>
