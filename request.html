<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>희망도서 신청</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- 안내 팝업 모달 추가 -->
<div id="guideModal" style="
    display: flex;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
">
    <div style="
        background-color: white;
        padding: 25px;
        border-radius: 20px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        text-align: center;
    ">
        <h3 style="margin-top: 0; margin-bottom: 15px; color: #333; font-size: 19px; font-weight: 700;">희망도서 신청 안내</h3>
        <div style="font-size: 14.5px; line-height: 1.6; color: #444; margin-bottom: 22px; text-align: left; word-break: keep-all;">
            <span style="color: #d32f2f; font-weight: 700;">정치, 종교, 투자 관련 및 특정기업 시험책</span>은 요청하여도 <span style="color: #d32f2f; font-weight: 700;">구매가 불가</span>합니다.<br><br>
            많은 입주민이 함께 읽을 수 있는 <span style="color: #4caf50; font-weight: 700;">베스트셀러 / 자기계발</span> 등에 관련된 책 위주로 신청 부탁드립니다.
        </div>
        <button id="closeModalBtn" style="
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        ">확인했습니다</button>
    </div>
</div>

<div class="admin-header">
<div>
<h1>희망도서 신청</h1>
<p>원하는 도서를 신청해주세요</p>
</div>
<a href="index.html" class="logout-btn">홈으로</a>
</div>

<div class="admin-card">
<h2>희망도서 신청</h2>

<!-- 동호수 입력 필드 및 안내 문구 -->
<input type="text" id="reqDongHo" placeholder="동호수 (예: 101동 102호)">
<p style="font-size: 12px; color: #e53935; margin-top: -5px; margin-bottom: 15px; padding-left: 5px; font-weight: 600;">
    * 입력하신 동호수는 관리자만 볼 수 있습니다.
</p>

<input type="text" id="reqTitle" placeholder="책 제목">
<input type="text" id="reqAuthor" placeholder="저자">
<input type="text" id="reqPublisher" placeholder="출판사 (선택)">

<textarea id="reqComment" placeholder="기타 의견 (선택)" style="
width:100%;
height:100px;
padding:12px;
border:1px solid #ddd;
border-radius:12px;
margin-bottom:10px;
resize:none;
"></textarea>

<button id="requestBtn" class="save-btn">신청하기</button>
</div>

<div class="admin-card">
<h2>신청 현황</h2>
<div id="requestList"></div>
</div>

<div class="bottom-nav">
<a href="index.html" class="nav-item">
<i class="fa-solid fa-house"></i>
<span>홈</span>
</a>
<a href="request.html" class="nav-item active">
<i class="fa-solid fa-book"></i>
<span>희망도서</span>
</a>
</div>

<script type="module" src="request.js"></script>
</body>
</html>
