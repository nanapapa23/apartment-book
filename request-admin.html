<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>희망도서 관리</title>
<link rel="stylesheet" href="style.css">
<style>
.request-admin-card{
    background:white;
    padding:20px;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.05);
}
.request-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:5px;
}
.request-info{
    color:#666;
    font-size:13px;
    margin-bottom:10px;
}
.status-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}
.status-buttons button{
    border:none;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}
.btn-planned{
    background:#ff9800;
    color:white;
}
.btn-completed{
    background:#4caf50;
    color:white;
}
.btn-rejected{
    background:#f44336;
    color:white;
}
/* 관리자 삭제 버튼 스타일 추가 */
.btn-delete{
    background:#555555;
    color:white;
}
.reason-box{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:1px solid #ddd;
    border-radius:10px;
}
</style>
</head>
<body>
<div class="admin-header">
<div>
<h1>희망도서 관리</h1>
<p>입주민 신청도서 관리</p>
</div>
<a href="admin.html" class="logout-btn">관리자 홈</a>
</div>

<div class="admin-card">
<h2>신청 목록</h2>
<div id="requestAdminList"></div>
</div>

<script type="module" src="request-admin.js"></script>
</body>
</html>
