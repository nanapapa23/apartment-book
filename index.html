
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효성해링턴 2단지 작은도서관</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="adminIcon">🔐</div>
    
    <div class="search-container">
        <h2>도서 검색</h2>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="search" placeholder="도서명 / 저자 / 초성 검색">
        </div>
    </div>

    <div class="section-title">📖 신간도서</div>
    <div id="newBooks"></div>

    <div class="section-title">📂 도서 카테고리</div>
    <div class="category-grid" id="categoryGrid">
        <div class="category-item" data-category="전체"><i class="fas fa-book-reader"></i>전체</div>
        <div class="category-item" data-category="성인"><i class="fas fa-user-tie"></i>성인</div>
        <div class="category-item" data-category="청소년"><i class="fas fa-user-graduate"></i>청소년</div>
        <div class="category-item" data-category="어린이"><i class="fas fa-child"></i>어린이</div>
        <div class="category-item" data-category="자기개발"><i class="fas fa-lightbulb"></i>자기개발</div>
        <div class="category-item" data-category="기타"><i class="fas fa-ellipsis-h"></i>기타</div>
    </div>

    <div class="section-title">📚 도서 목록</div>
    <div id="bookList"></div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h2 id="detailTitle" style="margin-bottom:10px;"></h2>
            <p id="detailAuthor" style="margin-bottom:20px; color:#666;"></p>
            <div id="shelfView"></div>
            <button id="closeBtn" style="width:100%; margin-top:20px; padding:12px; border-radius:10px; border:none; background:#eee; cursor:pointer;">닫기</button>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
