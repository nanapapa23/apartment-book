
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효성해링턴 작은도서관</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="adminIcon">🔐</div>

<div style="margin-top:30px; margin-bottom:15px; display:flex; gap:10px;">
    <input id="search" placeholder="도서명 또는 저자 검색..." style="padding:8px; width:70%; font-size:14px;">
    <button id="wishBtn" style="padding:8px; font-size:12px; cursor:pointer;">희망도서신청</button>
</div>

    <div class="section-title">신간 도서</div>
    <div id="newBooks"></div>

    <div class="section-title">도서 카테고리</div>
    <div class="category-grid" id="categoryGrid">
        <div class="category-item" data-category="전체"><i class="fas fa-book-reader"></i>전체</div>
        <div class="category-item" data-category="성인"><i class="fas fa-user-tie"></i>성인</div>
        <div class="category-item" data-category="청소년"><i class="fas fa-user-graduate"></i>청소년</div>
        <div class="category-item" data-category="어린이"><i class="fas fa-child"></i>어린이</div>
        <div class="category-item" data-category="자기개발"><i class="fas fa-lightbulb"></i>자기개발</div>
        <div class="category-item" data-category="기타"><i class="fas fa-ellipsis-h"></i>기타</div>
    </div>

    <div id="bookList" style="margin-top:20px;"></div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h2 id="detailTitle"></h2>
            <div id="detailAuthor"></div>
            <div id="shelfView"></div>
            <button id="closeBtn" style="width:100%; margin-top:20px; padding:10px;">닫기</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
