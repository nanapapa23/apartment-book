<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>효성해링턴 작은도서관</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="adminIcon">🔐</div>

    <div style="margin-top:30px; margin-bottom:15px; display:flex; justify-content:center;">
        <input id="search" placeholder="도서명 또는 저자 검색..." style="padding:8px; width:90%; font-size:14px;">
    </div>

    <div class="section-title">신간 도서</div>
    <div id="newBooks"></div>

    <div class="section-title">도서 카테고리</div>
    <div class="category-grid" id="categoryGrid">
        <div class="category-item" data-category="전체">전체</div>
        <div class="category-item" data-category="성인">성인</div>
        <div class="category-item" data-category="청소년">청소년</div>
        <div class="category-item" data-category="어린이">어린이</div>
        <div class="category-item" data-category="자기개발">자기개발</div>
        <div class="category-item" data-category="희망도서" style="background:#ffcc80;">희망도서</div>
    </div>

    <div id="bookList" style="margin-top:20px;"></div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h2 id="detailTitle"></h2>
            <div id="detailAuthor"></div>
            <div id="shelfView"></div>
            <button id="closeBtn" style="width:100%; margin-top:20px; padding:10px;">닫기</button>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
