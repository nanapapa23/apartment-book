<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>효성해링턴 2단지 작은도서관</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

.header{
background:#2e7d32;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
z-index:100;
}

.lock-btn{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:white;
font-size:22px;
cursor:pointer;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
padding-bottom:330px;
}

.search-box{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:15px;
box-sizing:border-box;
}

.grid-menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.grid-btn{
padding:12px;
border:none;
border-radius:10px;
background:white;
cursor:pointer;
font-weight:bold;
}

.grid-btn.active{
background:#2e7d32;
color:white;
}

.book-item{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.book-wrap{
display:flex;
gap:12px;
}

.book-cover{
width:80px;
height:110px;
border-radius:8px;
object-fit:cover;
background:#ddd;
}

.book-info{
flex:1;
}

.book-title{
font-size:18px;
font-weight:bold;
}

.book-author{
color:#666;
margin-top:5px;
}

.book-tag{
display:inline-block;
background:#e8f5e9;
padding:4px 8px;
border-radius:5px;
margin-top:8px;
font-size:12px;
}

.book-actions{
display:flex;
gap:8px;
margin-top:10px;
}

.small-btn{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:12px;
}

.delete-btn{
background:#d32f2f;
color:white;
}

.new-btn{
background:#fbc02d;
}

.location-btn{
background:#2e7d32;
color:white;
}

.admin{
display:none;
background:#fff3e0;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.admin input,
.admin select,
.admin button{
width:100%;
padding:12px;
margin-bottom:10px;
box-sizing:border-box;
}

.new-books{
display:flex;
gap:10px;
overflow-x:auto;
margin-bottom:20px;
}

.new-card{
background:white;
padding:10px;
border-radius:10px;
min-width:120px;
cursor:pointer;
}

.new-card img{
width:100%;
height:160px;
object-fit:cover;
border-radius:8px;
}

.location-banner{
position:fixed;
bottom:-500px;
left:0;
right:0;
background:#222;
color:white;
padding:15px;
transition:0.3s;
border-top-left-radius:20px;
border-top-right-radius:20px;
z-index:999;
}

.location-banner.show{
bottom:0;
}

.library-room{
display:flex;
gap:5px;
margin-top:15px;
}

.shelf{
flex:1;
background:#4e342e;
border-radius:6px;
overflow:hidden;
}

.shelf-title{
background:#8d6e63;
text-align:center;
padding:4px;
font-size:12px;
}

.cell{
height:28px;
display:flex;
align-items:center;
justify-content:center;
background:#2d1c19;
border-top:1px solid #5d4037;
font-size:12px;
}

.highlight{
background:yellow !important;
color:black !important;
font-weight:bold;
}

.close-btn{
width:100%;
padding:12px;
margin-top:15px;
background:#444;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
📚 효성해링턴 2단지 작은도서관
<button class="lock-btn" onclick="toggleAdmin()">🔒</button>
</div>

<div class="container">

<div class="admin" id="adminBox">

<input type="text" id="title" placeholder="도서명">

<input type="text" id="author" placeholder="저자">

<select id="category">
<option>성인</option>
<option>청소년</option>
<option>어린이</option>
<option>여행</option>
<option>요리</option>
</select>

<select id="shelf">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
</select>

<select id="floor">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
</select>

<button onclick="addBook()">📌 도서 등록</button>

<input type="file" id="csvFile" accept=".csv">

<button onclick="uploadCSV()">📂 CSV 대량 업로드</button>

<button onclick="downloadCSV()">📥 전체목록 다운로드</button>

</div>

<input
type="text"
id="search"
class="search-box"
placeholder="도서명 또는 저자 검색">

<h3>✨ 신규 도서</h3>

<div class="new-books" id="newBooks"></div>

<div class="grid-menu">

<button class="grid-btn active" onclick="filterCategory('전체',this)">전체</button>

<button class="grid-btn" onclick="filterCategory('성인',this)">성인</button>

<button class="grid-btn" onclick="filterCategory('청소년',this)">청소년</button>

<button class="grid-btn" onclick="filterCategory('어린이',this)">어린이</button>

<button class="grid-btn" onclick="filterCategory('여행',this)">여행</button>

<button class="grid-btn" onclick="filterCategory('요리',this)">요리</button>

</div>

<div id="bookList"></div>

</div>

<div class="location-banner" id="banner">

<div id="locationText"></div>

<div class="library-room" id="room"></div>

<button class="close-btn" onclick="closeBanner()">닫기</button>

</div>

<script>

let books = JSON.parse(localStorage.getItem('books')) || [

{
title:'소년이 온다',
author:'한강',
category:'성인',
location:'A책장 3단',
isNew:true
},

{
title:'불편한 편의점',
author:'김호연',
category:'청소년',
location:'C책장 1단',
isNew:true
}

];

let currentCategory='전체';

let admin=false;

const room=document.getElementById('room');

['A','B','C','D','E'].forEach(s=>{

let html=`
<div class="shelf">
<div class="shelf-title">${s} 책장</div>
`;

for(let i=7;i>=1;i--){

html+=`
<div class="cell" id="${s}-${i}">
${i}단
</div>
`;

}

html+='</div>';

room.innerHTML+=html;

});

function saveBooks(){

localStorage.setItem(
'books',
JSON.stringify(books)
);

}

function getBookCover(title, author){

return `https://source.unsplash.com/300x450/?book,${encodeURIComponent(title)},${encodeURIComponent(author)}`;

}

function renderBooks(){

const keyword=
document.getElementById('search')
.value
.toLowerCase();

const list=
document.getElementById('bookList');

list.innerHTML='';

const filtered=books.filter(book=>{

const cat=
currentCategory==='전체' ||
book.category===currentCategory;

const key=
book.title.toLowerCase().includes(keyword) ||
book.author.toLowerCase().includes(keyword);

return cat && key;

});

filtered.forEach((book,index)=>{

const div=document.createElement('div');

div.className='book-item';

div.innerHTML=`

<div class="book-wrap">

<img
class="book-cover"
src="${getBookCover(book.title,book.author)}"
onerror="this.src='https://via.placeholder.com/80x110?text=BOOK'"
>

<div class="book-info">

<div class="book-title">
${book.title}
</div>

<div class="book-author">
${book.author}
</div>

<div class="book-tag">
${book.category}
</div>

<div class="book-actions">

<button
class="small-btn location-btn"
onclick="event.stopPropagation();showLocation('${book.title}','${book.location}')">
위치
</button>

<button
class="small-btn new-btn"
onclick="event.stopPropagation();toggleNew(${index})">

${book.isNew ? '⭐ 신규해제' : '☆ 신규등록'}

</button>

<button
class="small-btn delete-btn"
onclick="event.stopPropagation();deleteBook(${index})">

삭제

</button>

</div>

</div>

</div>

`;

list.appendChild(div);

});

}

function renderNewBooks(){

const area=
document.getElementById('newBooks');

area.innerHTML='';

books
.filter(book=>book.isNew)
.forEach(book=>{

const div=document.createElement('div');

div.className='new-card';

div.innerHTML=`

<img
src="${getBookCover(book.title,book.author)}"
onerror="this.src='https://via.placeholder.com/120x160?text=BOOK'"
>

<div>
<b>${book.title}</b>
</div>

<div>
${book.author}
</div>

`;

div.onclick=()=>{

showLocation(
book.title,
book.location
);

};

area.appendChild(div);

});

}

function showLocation(title,location){

const banner=
document.getElementById('banner');

banner.classList.add('show');

document.getElementById('locationText')
.innerHTML=
`📖 ${title}<br><br>${location}`;

document
.querySelectorAll('.cell')
.forEach(c=>c.classList.remove('highlight'));

const shelf=location.charAt(0);

const floor=
location.match(/\d+/)[0];

const target=
document.getElementById(`${shelf}-${floor}`);

if(target){

target.classList.add('highlight');

}

}

function closeBanner(){

document
.getElementById('banner')
.classList.remove('show');

}

function filterCategory(category,el){

currentCategory=category;

document
.querySelectorAll('.grid-btn')
.forEach(btn=>btn.classList.remove('active'));

el.classList.add('active');

renderBooks();

}

function toggleAdmin(){

if(!admin){

const id=prompt('ID');

const pw=prompt('PW');

if(id==='admin' && pw==='1234'){

admin=true;

document
.getElementById('adminBox')
.style.display='block';

}else{

alert('로그인 실패');

}

}else{

admin=false;

document
.getElementById('adminBox')
.style.display='none';

}

}

function addBook(){

const title=
document.getElementById('title').value;

const author=
document.getElementById('author').value;

const category=
document.getElementById('category').value;

const shelf=
document.getElementById('shelf').value;

const floor=
document.getElementById('floor').value;

if(!title || !author){

alert('입력하세요');

return;

}

books.push({

title,
author,
category,
location:`${shelf}책장 ${floor}단`,
isNew:false

});

saveBooks();

renderBooks();

renderNewBooks();

alert('등록 완료');

}

function deleteBook(index){

if(!confirm('삭제할까요?')) return;

books.splice(index,1);

saveBooks();

renderBooks();

renderNewBooks();

}

function toggleNew(index){

books[index].isNew=!books[index].isNew;

saveBooks();

renderBooks();

renderNewBooks();

}

function downloadCSV(){

let csv='도서명,저자,위치,카테고리\n';

books.forEach(book=>{

csv+=
`${book.title},${book.author},${book.location},${book.category}\n`;

});

const blob=new Blob(
["\uFEFF"+csv],
{
type:'text/csv;charset=utf-8;'
}
);

const link=document.createElement('a');

const now=new Date();

const yy=
String(now.getFullYear()).slice(2);

const mm=
String(now.getMonth()+1).padStart(2,'0');

const dd=
String(now.getDate()).padStart(2,'0');

link.href=
URL.createObjectURL(blob);

link.download=
`${yy}${mm}${dd}_booklist.csv`;

link.click();

}

function uploadCSV(){

const fileInput=
document.getElementById('csvFile');

const file=fileInput.files[0];

if(!file){

alert('CSV 파일 선택');

return;

}

const reader=new FileReader();

reader.onload=function(e){

const text=e.target.result;

const lines=text.split('\n');

for(let i=1;i<lines.length;i++){

const row=lines[i].trim();

if(!row) continue;

const cols=row.split(',');

if(cols.length>=4){

books.push({

title:cols[0].trim(),
author:cols[1].trim(),
location:cols[2].trim(),
category:cols[3].trim(),
isNew:false

});

}

}

saveBooks();

renderBooks();

renderNewBooks();

alert('대량 업로드 완료');

};

reader.readAsText(file,'utf-8');

}

document
.getElementById('search')
.addEventListener('input',renderBooks);

renderBooks();

renderNewBooks();

</script>

</body>
</html>
