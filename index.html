<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>효성해링턴 작은도서관</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="adminIcon" style="position:fixed; top:20px; right:20px; cursor:pointer; font-size:20px;">🔐</div>
    <div class="search-container">
        <h2>도서 검색</h2>
        <div class="search-box"><i class="fas fa-search"></i><input type="text" id="search" placeholder="도서명 / 저자 검색"></div>
    </div>
    
    <div class="section-title">📂 카테고리</div>
    <div class="category-grid">
        <div class="category-item" data-category="전체">전체</div>
        <div class="category-item" data-category="성인">성인</div>
        <div class="category-item" data-category="청소년">청소년</div>
        <div class="category-item" data-category="어린이">어린이</div>
        <div class="category-item" data-category="자기개발">자기개발</div>
    </div>

    <div class="section-title">📚 도서 목록</div>
    <div id="bookList"></div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h2 id="detailTitle"></h2>
            <div id="shelfView"></div>
            <button id="closeBtn" style="width:100%; padding:12px; margin-top:20px; border:none; border-radius:10px;">닫기</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
