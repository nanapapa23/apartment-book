<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>효성해링턴 2단지 작은도서관</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

.header{
background:#2e7d32;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
z-index:100;
}

.lock-btn{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:white;
font-size:28px;
cursor:pointer;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
padding-bottom:330px;
}

.search-box{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:15px;
box-sizing:border-box;
}

.book-item{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.book-title{font-size:18px;font-weight:bold;}
.book-author{color:#666;margin-top:5px;}
.book-location{font-size:13px;color:#555;margin-top:5px;}

.admin{
display:none;
background:#fff3e0;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.admin input,
.admin select,
.admin button{
width:100%;
padding:12px;
margin-bottom:10px;
box-sizing:border-box;
}

.location-banner{
position:fixed;
bottom:-300px;
left:0;
right:0;
background:#222;
color:white;
padding:15px;
transition:0.3s;
border-top-left-radius:20px;
border-top-right-radius:20px;
z-index:999;
}

.location-banner.show{
bottom:0;
}

.close-btn{
width:100%;
padding:12px;
margin-top:15px;
background:#444;
border:none;
color:white;
border-radius:8px;
}
</style>
</head>

<body>

<div class="header">
📚 효성해링턴 2단지 작은도서관
<button class="lock-btn" onclick="toggleAdmin()">🔒</button>
</div>

<div class="container">

<div class="admin" id="adminBox">
<h3>⚙️ 관리자 모드</h3>

<input id="title" placeholder="도서명">
<input id="author" placeholder="저자">

<select id="category">
<option>소설</option><option>경제</option><option>자기계발</option>
<option>유아</option><option>초등</option>
</select>

<select id="shelf">
<option>A</option><option>B</option><option>C</option><option>D</option><option>E</option>
</select>

<select id="floor">
<option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
</select>

<button onclick="addBook()">📌 도서 등록</button>
</div>

<input class="search-box" id="search" placeholder="검색">

<div id="bookList"></div>

</div>

<div class="location-banner" id="banner">
<div id="locationText"></div>
<button class="close-btn" onclick="closeBanner()">닫기</button>
</div>

<!-- 🔥 Firebase (COMPAT 안정버전) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyCmUeJ5YOmn9gGEWX3B5RJEFN9uvge8HWQ",
authDomain: "library-app-3dba2.firebaseapp.com",
projectId: "library-app-3dba2",
storageBucket: "library-app-3dba2.firebasestorage.app",
messagingSenderId: "645901694711",
appId: "1:645901694711:web:f4f4802c3517ecc644c5f2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let books = [];
let admin = false;

const list = document.getElementById("bookList");

/* 📦 실시간 데이터 */
firebase.database().ref("books").on("value", snap=>{
books = [];
snap.forEach(d=>{
books.push({id:d.key, ...d.val()});
});
render();
});

/* 📌 책 추가 */
window.addBook = function(){
const title = document.getElementById("title").value;
const author = document.getElementById("author").value;

if(!title) return alert("제목 입력");

firebase.database().ref("books").push({
title,
author,
location: document.getElementById("shelf").value + "책장 " + document.getElementById("floor").value + "단",
category: document.getElementById("category").value
});
};

/* 📌 렌더 */
function render(){
const k = (document.getElementById("search").value || "").toLowerCase();

list.innerHTML = "";

books.filter(b =>
(b.title || "").toLowerCase().includes(k) ||
(b.author || "").toLowerCase().includes(k)
).forEach(b => {

const div = document.createElement("div");
div.className = "book-item";

div.innerHTML = `
<div class="book-title">${b.title}</div>
<div class="book-author">${b.author || ""}</div>
<div class="book-location">📍 ${b.location || ""}</div>
`;

div.onclick = () => {
showLocation(b.title, b.location);
};

list.appendChild(div);
});
}

/* 📍 위치 */
window.showLocation = function(title,location){
document.getElementById("banner").classList.add("show");
document.getElementById("locationText").innerHTML =
"📖 " + title + "<br>" + location;
};

window.closeBanner = function(){
document.getElementById("banner").classList.remove("show");
};

/* 🔐 관리자 */
window.toggleAdmin = function(){
admin = !admin;
document.getElementById("adminBox").style.display =
admin ? "block" : "none";
};

/* 🔍 검색 */
document.getElementById("search").addEventListener("input", render);

</script>

</body>
</html>
