<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>효성해링턴 2단지 작은도서관</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">📚 도서관 검색</div>
    <input type="text" id="search" placeholder="도서명 / 저자 검색">
    <div id="newBooks" style="display:flex; gap:10px; overflow-x:auto;"></div>
    <div id="bookList"></div>
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h2 id="detailTitle"></h2>
            <p id="detailAuthor"></p>
            <div id="shelfView"></div>
            <button id="closeBtn" class="btn-sub" style="margin-top:20px; width:100%;">닫기</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
