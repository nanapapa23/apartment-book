<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>남율 효성해링턴 2단지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700;900&display=swap">
<style>
:root{--lib:#dfe9e3;--lib-ink:#143a2e;--gym:#1b35d6;--hi:#ffd43b}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;display:flex;flex-direction:column;font-family:"Noto Sans KR",sans-serif}
.panel{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 24px 46px;overflow:hidden;transition:flex-grow .25s}
.panel:active{flex-grow:1.25}
.lib{background:var(--lib);color:var(--lib-ink);padding-top:72px}
.gym{background:var(--gym);color:#fff}
.panel h2{font-size:clamp(46px,15vw,88px);line-height:1.08;font-weight:900}
.lib h2{font-family:"Noto Serif KR",serif}
.panel h2 a{color:inherit;text-decoration:none}
.panel h2 a::after{content:"";position:absolute;inset:0}
.panel p{margin-top:10px;font-size:15px;line-height:1.5;opacity:.8}
.panel svg{position:absolute;right:22px;top:22px;width:min(42vw,210px)}
.lib svg{top:64px}
.gym svg{color:var(--hi)}
.live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;min-height:42px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:#fff;color:#0e1740;font-size:17px;font-weight:900;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.pill i{width:12px;height:12px;border-radius:50%;background:#f04438}
.pill.on i{background:#12b76a;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #12b76a99}70%{box-shadow:0 0 0 10px #12b76a00}100%{box-shadow:0 0 0 0 #12b76a00}}
.hrs{font-size:14px;font-weight:700}
.note{flex-basis:100%;font-size:14px;line-height:1.4}
.adm{position:absolute;z-index:4;right:16px;top:14px;padding:6px 12px;border-radius:999px;background:#fff;color:var(--lib-ink);font-size:12px;font-weight:700;text-decoration:none;opacity:.9}
.brand{position:absolute;z-index:3;left:24px;top:20px;font-size:13px;font-weight:700;color:var(--lib-ink)}
:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.lib :focus-visible{outline-color:var(--gym)}
@media(min-width:760px){body{flex-direction:row}.panel{padding-bottom:56px}.panel:hover{flex-grow:1.2}}
@media(prefers-reduced-motion:reduce){.panel{transition:none}.pill.on i{animation:none}}
</style></head><body>
<div class="brand">남율 효성해링턴 2단지</div>
<a class="adm" href="admin.html">관리자</a>
<section class="panel lib">
<svg viewBox="0 0 200 120" fill="currentColor" aria-hidden="true"><rect x="10" y="30" width="22" height="90" rx="3" opacity=".9"/><rect x="36" y="14" width="26" height="106" rx="3" opacity=".6"/><rect x="66" y="40" width="20" height="80" rx="3"/><rect x="90" y="22" width="28" height="98" rx="3" opacity=".75"/><rect x="122" y="48" width="22" height="72" rx="3" opacity=".5"/><rect x="152" y="36" width="22" height="84" rx="3" transform="rotate(12 163 120)"/></svg>
<div class="live" id="live-lib"></div>
<h2><a href="library.html">작은도서관</a></h2><p>도서 검색 · 봉사신청 · 희망도서</p>
</section>
<section class="panel gym">
<svg viewBox="0 0 200 80" fill="currentColor" aria-hidden="true"><rect x="20" y="37" width="160" height="6" rx="3"/><rect x="34" y="6" width="14" height="68" rx="4"/><rect x="52" y="18" width="10" height="44" rx="3"/><rect x="152" y="6" width="14" height="68" rx="4"/><rect x="138" y="18" width="10" height="44" rx="3"/></svg>
<div class="live" id="live-fit"></div>
<h2><a href="fitness.html">휘트니스<br>센터</a></h2><p>공지 · 수리요청 · 희망기구추천 · 건의사항</p>
</section>
<script type="module">
import{site,openState,esc}from"./common.js";
const cfg={};
const draw=()=>{for(const id of["lib","fit"]){const el=document.getElementById("live-"+id),c=cfg[id];if(!c){el.innerHTML='<span class="pill"><i style="background:#98a2b3;animation:none"></i>운영 안내 준비중</span>';continue}const o=openState(c);el.innerHTML=`<span class="pill ${o.open?"on":"off"}"><i></i>${o.open?"지금 운영중":"운영종료"}</span>${o.hrs?`<span class="hrs">${esc(o.hrs)}</span>`:""}${o.note?`<div class="note">${esc(o.note)}</div>`:""}`}};
Promise.all(["lib","fit"].map(async id=>{try{cfg[id]=await site(id)}catch{}})).then(draw);
setInterval(draw,60000);
</script>
</body></html>
