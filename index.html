<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>효성해링턴 2단지 작은도서관</title>

<style>

body{
margin:0;
padding:20px;
font-family:sans-serif;
background:#f5f5f5;
}

.header{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:20px;
}

#search{
width:100%;
padding:14px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

.book{
background:white;
padding:15px;
margin-top:12px;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.title{
font-size:18px;
font-weight:bold;
}

.author{
margin-top:6px;
color:#666;
}

.status{
margin-top:8px;
font-weight:bold;
}

.available{
color:green;
}

.borrowed{
color:red;
}

.count{
margin-top:15px;
font-size:14px;
color:#666;
}

</style>
</head>

<body>

<div class="header">
📚 효성해링턴 2단지 작은도서관
</div>

<input
type="text"
id="search"
placeholder="도서명 검색">

<div class="count" id="count"></div>

<div id="bookList"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkf11w1Bu5IZ_sggCT_GqMjTKnFy9fyuE",
  authDomain: "chilgokbookcafe.firebaseapp.com",
  projectId: "chilgokbookcafe",
  storageBucket: "chilgokbookcafe.firebasestorage.app",
  messagingSenderId: "150579513603",
  appId: "1:150579513603:web:bc76fe94bbddf244084136"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const bookList =
document.getElementById("bookList");

const search =
document.getElementById("search");

const count =
document.getElementById("count");

let books = [];

async function loadBooks(){

try{

const snapshot =
await getDocs(
collection(db,"books")
);

books=[];

snapshot.forEach(doc=>{

books.push(doc.data());

});

renderBooks(books);

}catch(error){

bookList.innerHTML=
"<h3>Firebase 연결 오류</h3>";

console.error(error);

}

}

function renderBooks(data){

bookList.innerHTML="";

count.innerText =
"총 " + data.length + "권";

data.forEach(book=>{

const div =
document.createElement("div");

div.className="book";

div.innerHTML=`

<div class="title">
${book.title || ""}
</div>

<div class="author">
저자 : ${book.author || ""}
</div>

<div class="status ${
book.status==="대출가능"
? "available"
: "borrowed"
}">
${book.status || ""}
</div>

`;

bookList.appendChild(div);

});

}

search.addEventListener("input",()=>{

const keyword =
search.value.toLowerCase();

const filtered =
books.filter(book=>

(book.title || "")
.toLowerCase()
.includes(keyword)

);

renderBooks(filtered);

});

loadBooks();

</script>

</body>
</html>
