<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>칠곡남율효성해링턴플레이스 2단지 작은도서관</title>

<style>

:root{
  --main:#2e7d32;
  --bg:#f4f6f8;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:#222;
}

.header{
  background:var(--main);
  color:white;
  padding:18px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  position:sticky;
  top:0;
  z-index:100;
}

.lock-btn{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:none;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
  padding-bottom:320px;
}

.search-box{
  width:100%;
  padding:15px;
  border-radius:10px;
  border:2px solid #ddd;
  font-size:16px;
  margin-bottom:15px;
}

.grid-menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}

.grid-btn{
  border:none;
  border-radius:12px;
  padding:15px;
  background:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
}

.grid-btn.active{
  background:var(--main);
  color:white;
}

.section{
  margin-bottom:20px;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.new-books{
  display:flex;
  overflow-x:auto;
  gap:12px;
}

.new-card{
  min-width:130px;
  background:white;
  border-radius:12px;
  padding:10px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.new-card img{
  width:100%;
  height:170px;
  object-fit:cover;
  border-radius:8px;
}

.new-title{
  margin-top:8px;
  font-weight:bold;
  font-size:14px;
}

.new-author{
  font-size:12px;
  color:#666;
}

.book-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.book-item{
  background:white;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.book-wrap{
  display:flex;
  gap:12px;
}

.book-cover{
  width:80px;
  height:110px;
  object-fit:cover;
  border-radius:8px;
  background:#ddd;
}

.book-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:5px;
}

.book-author{
  color:#666;
  margin-bottom:5px;
}

.book-tag{
  display:inline-block;
  background:#e8f5e9;
  color:var(--main);
  padding:4px 8px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

.admin{
  display:none;
  background:#fff3e0;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

.admin input,
.admin select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.admin button{
  width:100%;
  border:none;
  padding:13px;
  border-radius:8px;
  background:#ef6c00;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:10px;
}

.location-banner{
  position:fixed;
  left:0;
  right:0;
  bottom:-500px;
  background:#222;
  color:white;
  padding:15px;
  transition:0.3s;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
  z-index:999;
}

.location-banner.show{
  bottom:0;
}

.library-room{
  display:flex;
  gap:5px;
  margin-top:15px;
}

.shelf{
  flex:1;
  background:#4e342e;
  border-radius:6px;
  overflow:hidden;
}

.shelf-title{
  background:#8d6e63;
  text-align:center;
  padding:4px;
  font-size:12px;
  font-weight:bold;
}

.cell{
  height:28px;
  border-top:1px solid #5d4037;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  background:#2d1c19;
}

.highlight{
  background:#ffeb3b !important;
  color:black !important;
  font-weight:bold;
}

.delete-btn{
  background:#c62828 !important;
}

.close-btn{
  margin-top:15px;
  background:#444;
  color:white;
  border:none;
  padding:10px;
  border-radius:8px;
  width:100%;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
📚 효성해링턴 2단지 작은도서관
<button class="lock-btn" onclick="toggleAdmin()">🔒</button>
</div>

<div class="container">

<div class="admin" id="adminBox">

<input type="text" id="title" placeholder="도서명">
<input type="text" id="author" placeholder="저자">

<select id="category">
<option>성인</option>
<option>청소년</option>
<option>어린이</option>
<option>여행</option>
<option>요리</option>
</select>

<select id="shelf">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
</select>

<select id="floor">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
</select>

<label style="font-size:14px;">
<input type="checkbox" id="isNew">
신규도서 등록
</label>

<button onclick="addBook()">📌 책 등록</button>

<input type="file" id="csvFile" accept=".csv">

<button onclick="downloadCSV()">📥 전체목록 다운로드</button>

<button class="delete-btn" onclick="deleteBook()">🗑 선택도서 삭제</button>

</div>

<input
type="text"
class="search-box"
id="search"
placeholder="도서명 또는 저자 검색">

<div class="section">

<div class="section-title">
✨ 신규 입고 도서
</div>

<div class="new-books" id="newBooks"></div>

</div>

<div class="grid-menu">

<button class="grid-btn active" onclick="filterCategory('전체',this)">전체</button>
<button class="grid-btn" onclick="filterCategory('성인',this)">성인</button>
<button class="grid-btn" onclick="filterCategory('청소년',this)">청소년</button>
<button class="grid-btn" onclick="filterCategory('어린이',this)">어린이</button>
<button class="grid-btn" onclick="filterCategory('여행',this)">여행</button>
<button class="grid-btn" onclick="filterCategory('요리',this)">요리</button>

</div>

<div class="book-list" id="bookList"></div>

</div>

<div class="location-banner" id="banner">

<div id="locationText"></div>

<div class="library-room" id="room"></div>

<button class="close-btn" onclick="closeBanner()">닫기</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

/* 여기에 Firebase 코드 넣기 */

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_ID = "admin";
const ADMIN_PW = atob("MTIzNA==");

let admin = false;
let books = [];
let currentCategory = "전체";
let selectedId = null;

const room = document.getElementById("room");

["A","B","C","D","E"].forEach(s=>{

let html=`
<div class="shelf">
<div class="shelf-title">${s} 책장</div>
`;

for(let i=7;i>=1;i--){

html+=`
<div class="cell" id="${s}-${i}">
${i}단
</div>
`;

}

html+=`</div>`;

room.innerHTML+=html;

});

async function loadBooks(){

books=[];

const querySnapshot = await getDocs(collection(db,"books"));

querySnapshot.forEach((docu)=>{

books.push({
id:docu.id,
...docu.data()
});

});

renderBooks();
renderNewBooks();

}

function renderBooks(){

const list=document.getElementById("bookList");
list.innerHTML="";

const keyword=document.getElementById("search")
.value.toLowerCase();

let filtered=books.filter(book=>{

const cat=
currentCategory==="전체" ||
book.category===currentCategory;

const key=
book.title.toLowerCase().includes(keyword) ||
book.author.toLowerCase().includes(keyword);

return cat && key;

});

filtered.forEach(book=>{

const div=document.createElement("div");
div.className="book-item";

const cover=
`https://covers.openlibrary.org/b/title/${encodeURIComponent(book.title)}-M.jpg`;

div.innerHTML=`

<div class="book-wrap">

<img
class="book-cover"
src="${cover}"
onerror="this.src='https://via.placeholder.com/80x110?text=NO+IMAGE'"
>

<div>

<div class="book-title">
${book.title}
</div>

<div class="book-author">
${book.author}
</div>

<div class="book-tag">
${book.category}
</div>

</div>

</div>

`;

div.onclick=()=>{

selectedId=book.id;

showLocation(
book.title,
book.location
);

};

list.appendChild(div);

});

}

function renderNewBooks(){

const area=document.getElementById("newBooks");

area.innerHTML="";

const newBooks=books.filter(b=>b.isNew);

newBooks.forEach(book=>{

const div=document.createElement("div");

div.className="new-card";

const cover=
`https://covers.openlibrary.org/b/title/${encodeURIComponent(book.title)}-M.jpg`;

div.innerHTML=`

<img
src="${cover}"
onerror="this.src='https://via.placeholder.com/120x170?text=NO+IMAGE'"
>

<div class="new-title">
${book.title}
</div>

<div class="new-author">
${book.author}
</div>

`;

div.onclick=()=>{

showLocation(
book.title,
book.location
);

};

area.appendChild(div);

});

}

window.filterCategory=(cat,el)=>{

currentCategory=cat;

document.querySelectorAll(".grid-btn")
.forEach(btn=>btn.classList.remove("active"));

el.classList.add("active");

renderBooks();

};

document
.getElementById("search")
.addEventListener("input",renderBooks);

window.toggleAdmin=()=>{

if(!admin){

const id=prompt("관리자 ID");
if(id===null)return;

const pw=prompt("비밀번호");
if(pw===null)return;

if(id===ADMIN_ID && pw===ADMIN_PW){

admin=true;

document.getElementById("adminBox")
.style.display="block";

alert("관리자모드 활성화");

}else{

alert("로그인 실패");

}

}else{

admin=false;

document.getElementById("adminBox")
.style.display="none";

}

};

window.addBook=async()=>{

const title=document.getElementById("title").value;
const author=document.getElementById("author").value;
const category=document.getElementById("category").value;
const shelf=document.getElementById("shelf").value;
const floor=document.getElementById("floor").value;
const isNew=document.getElementById("isNew").checked;

if(!title || !author){

alert("입력하세요");
return;

}

const location=`${shelf}책장 ${floor}단`;

await addDoc(collection(db,"books"),{

title,
author,
category,
location,
isNew

});

alert("등록 완료");

loadBooks();

};

window.deleteBook=async()=>{

if(!selectedId){

alert("삭제할 책 클릭");
return;

}

if(!confirm("삭제할까요?"))return;

await deleteDoc(doc(db,"books",selectedId));

alert("삭제 완료");

selectedId=null;

loadBooks();

};

window.downloadCSV=()=>{

let csv="도서명,저자,위치,카테고리\n";

books.forEach(book=>{

csv+=`${book.title},${book.author},${book.location},${book.category}\n`;

});

const blob=new Blob(
["\uFEFF"+csv],
{type:"text/csv;charset=utf-8;"}
);

const link=document.createElement("a");

const now=new Date();

const yy=String(now.getFullYear()).slice(2);
const mm=String(now.getMonth()+1).padStart(2,"0");
const dd=String(now.getDate()).padStart(2,"0");

link.href=URL.createObjectURL(blob);

link.download=
`${yy}${mm}${dd}_booklist.csv`;

link.click();

};

document
.getElementById("csvFile")
.addEventListener("change",async(e)=>{

const file=e.target.files[0];

if(!file)return;

const text=await file.text();

const rows=text.split("\n").slice(1);

for(const row of rows){

const cols=row.split(",");

if(cols.length>=4){

await addDoc(collection(db,"books"),{

title:cols[0].trim(),
author:cols[1].trim(),
location:cols[2].trim(),
category:cols[3].trim(),
isNew:false

});

}

}

alert("대량 업로드 완료");

loadBooks();

});

function showLocation(title,location){

document.getElementById("banner")
.classList.add("show");

document.getElementById("locationText")
.innerHTML=
`📖 ${title}<br><br>위치 : ${location}`;

document.querySelectorAll(".cell")
.forEach(c=>c.classList.remove("highlight"));

const shelf=location.charAt(0);

const floor=location.match(/\d+/)[0];

const cell=document.getElementById(`${shelf}-${floor}`);

if(cell){

cell.classList.add("highlight");

}

}

window.closeBanner=()=>{

document.getElementById("banner")
.classList.remove("show");

};

loadBooks();

</script>

</body>
</html>
