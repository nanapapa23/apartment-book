<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>효성해링턴 작은도서관</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">📚 효성해링턴 도서관</div>
    <div class="search-wrap"><input type="text" id="search" placeholder="도서명 / 저자 검색"></div>
    
    <div class="category-wrap">
        <button class="category-btn active" data-category="전체">전체</button>
        <button class="category-btn" data-category="성인">성인</button>
        <button class="category-btn" data-category="청소년">청소년</button>
        <button class="category-btn" data-category="어린이">어린이</button>
        <button class="category-btn" data-category="자기개발">자기개발</button>
        <button class="category-btn" data-category="기타">기타</button>
    </div>

    <div class="section-title">📚 도서 목록</div>
    <div id="bookList"></div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <h2 id="detailTitle"></h2>
            <div id="shelfView"></div>
            <button id="closeBtn" style="width:100%; padding:15px; margin-top:20px; border-radius:10px; border:none; background:#eee;">닫기</button>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
