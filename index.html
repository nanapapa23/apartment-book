<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>효성해링턴 2단지 작은도서관</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

.header{
background:#2e7d32;
color:white;
padding:18px;
text-align:center;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
z-index:100;
}

.lock-btn{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
color:white;
font-size:24px;
cursor:pointer;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
padding-bottom:330px;
}

.search-box{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
margin-bottom:15px;
box-sizing:border-box;
}

.grid-menu{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

.grid-btn{
padding:12px;
border:none;
border-radius:10px;
background:white;
cursor:pointer;
font-weight:bold;
}

.grid-btn.active{
background:#2e7d32;
color:white;
}

.book-item{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.08);
cursor:pointer;
}

.book-wrap{
display:flex;
gap:12px;
}

.book-image{
width:70px;
height:100px;
border-radius:8px;
background:white;
border:1px solid #ddd;
object-fit:cover;
flex-shrink:0;
}

.book-info{
flex:1;
}

.book-title{
font-size:18px;
font-weight:bold;
}

.book-author{
color:#666;
margin-top:5px;
}

.book-tag{
display:inline-block;
background:#e8f5e9;
padding:4px 8px;
border-radius:5px;
margin-top:8px;
font-size:12px;
}

.book-location{
margin-top:5px;
font-size:13px;
color:#555;
}

.book-actions{
display:flex;
gap:8px;
margin-top:10px;
flex-wrap:wrap;
}

.small-btn{
padding:6px 10px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:12px;
}

.location-btn{
background:#2e7d32;
color:white;
}

.delete-btn{
background:#d32f2f;
color:white;
}

.new-btn{
background:#fbc02d;
}

.admin{
display:none;
background:#fff3e0;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.admin input,
.admin select,
.admin button{
width:100%;
padding:12px;
margin-bottom:10px;
box-sizing:border-box;
}

.new-books{
display:flex;
gap:10px;
overflow-x:auto;
margin-bottom:20px;
}

.new-card{
background:white;
padding:12px;
border-radius:10px;
min-width:130px;
cursor:pointer;
box-shadow:0 2px 5px rgba(0,0,0,0.08);
}

.location-banner{
position:fixed;
bottom:-500px;
left:0;
right:0;
background:#222;
color:white;
padding:15px;
transition:0.3s;
border-top-left-radius:20px;
border-top-right-radius:20px;
z-index:999;
}

.location-banner.show{
bottom:0;
}

.library-room{
display:flex;
gap:5px;
margin-top:15px;
}

.shelf{
flex:1;
background:#4e342e;
border-radius:6px;
overflow:hidden;
}

.shelf-title{
background:#8d6e63;
text-align:center;
padding:4px;
font-size:12px;
}

.cell{
height:28px;
display:flex;
align-items:center;
justify-content:center;
background:#2d1c19;
border-top:1px solid #5d4037;
font-size:12px;
}

.highlight{
background:yellow !important;
color:black !important;
font-weight:bold;
}

.close-btn{
width:100%;
padding:12px;
margin-top:15px;
background:#444;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
}

.top-books{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.wish-box{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

.stats-box{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
}

</style>
</head>

<body>

<div class="header">

📚 효성해링턴 2단지 작은도서관

<button
class="lock-btn"
id="lockBtn"
onclick="toggleAdmin()">

🔒

</button>

</div>

<div class="container">

<div class="admin" id="adminBox">

<h3>관리자 모드</h3>

<input type="text" id="title" placeholder="도서명">

<input type="text" id="author" placeholder="저자">

<input type="text" id="imageUrl" placeholder="책 이미지 URL">

<select id="category">
<option>소설</option>
<option>경제</option>
<option>자기계발</option>
<option>유아</option>
<option>초등</option>
<option>중등</option>
<option>역사</option>
<option>과학</option>
<option>여행</option>
<option>요리</option>
</select>

<select id="shelf">
<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
</select>

<select id="floor">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
</select>

<button onclick="addBook()">
📌 도서 등록
</button>

<div style="font-size:13px;color:#666;margin-bottom:10px;">
CSV 형식 :
도서명,저자,위치,카테고리,이미지URL
</div>

<input type="file" id="csvFile" accept=".csv">

<button onclick="uploadCSV()">
📂 CSV 대량 업로드
</button>

<button onclick="downloadCSV()">
📥 전체목록 다운로드
</button>

</div>

<input
type="text"
id="search"
class="search-box"
placeholder="도서명 / 저자 / 초성 / 카테고리 / 위치 검색">

<div class="top-books">
<h3>🔥 인기 도서 TOP5</h3>
<div id="topBooksList"></div>
</div>

<div class="stats-box">
<h3>📊 도서관 통계</h3>

<div id="statsArea"></div>

</div>

<div class="wish-box">

<h3>📝 희망도서 신청</h3>

<input
type="text"
id="wishTitle"
placeholder="희망 도서명"
style="width:100%;padding:12px;margin-bottom:10px;box-sizing:border-box;">

<input
type="text"
id="wishAuthor"
placeholder="저자"
style="width:100%;padding:12px;margin-bottom:10px;box-sizing:border-box;">

<button
onclick="addWishBook()"
style="
width:100%;
padding:12px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;">

희망도서 신청

</button>

</div>

<h3>✨ 신규 도서</h3>

<div class="new-books" id="newBooks"></div>

<div class="grid-menu">

<button class="grid-btn active" onclick="filterCategory('전체',this)">전체</button>

<button class="grid-btn" onclick="filterCategory('소설',this)">소설</button>

<button class="grid-btn" onclick="filterCategory('경제',this)">경제</button>

<button class="grid-btn" onclick="filterCategory('자기계발',this)">자기계발</button>

<button class="grid-btn" onclick="filterCategory('유아',this)">유아</button>

<button class="grid-btn" onclick="filterCategory('초등',this)">초등</button>

</div>

<div id="bookList"></div>

</div>

<div class="location-banner" id="banner">

<div id="locationText"></div>

<div class="library-room" id="room"></div>

<button class="close-btn" onclick="closeBanner()">
닫기
</button>

</div>

<script>

let books =
JSON.parse(localStorage.getItem('books')) || [

{
title:'소년이 온다',
author:'한강',
category:'소설',
location:'A책장 3단',
isNew:true,
views:0,
image:''
},

{
title:'불편한 편의점',
author:'김호연',
category:'소설',
location:'C책장 1단',
isNew:true,
views:0,
image:''
}

];

let wishBooks =
JSON.parse(localStorage.getItem('wishBooks')) || [];

let currentCategory='전체';

let admin=false;

const room=document.getElementById('room');

['A','B','C','D','E'].forEach(s=>{

let html=`
<div class="shelf">
<div class="shelf-title">${s} 책장</div>
`;

for(let i=7;i>=1;i--){

html+=`
<div class="cell" id="${s}-${i}">
${i}단
</div>
`;

}

html+='</div>';

room.innerHTML+=html;

});

function saveBooks(){

localStorage.setItem(
'books',
JSON.stringify(books)
);

}

function getChosung(str){

const cho=[
'ㄱ','ㄲ','ㄴ','ㄷ','ㄸ',
'ㄹ','ㅁ','ㅂ','ㅃ','ㅅ',
'ㅆ','ㅇ','ㅈ','ㅉ','ㅊ',
'ㅋ','ㅌ','ㅍ','ㅎ'
];

let result='';

for(let s of str){

const code=s.charCodeAt(0)-44032;

if(code>-1 && code<11172){

result+=cho[Math.floor(code/588)];

}else{

result+=s;

}

}

return result;

}

function renderBooks(){

const keyword=
document
.getElementById('search')
.value
.toLowerCase()
.trim();

const list=
document.getElementById('bookList');

list.innerHTML='';

const filtered=books.filter(book=>{

const matchKeyword=

book.title.toLowerCase().includes(keyword) ||

book.author.toLowerCase().includes(keyword) ||

book.category.toLowerCase().includes(keyword) ||

book.location.toLowerCase().includes(keyword) ||

getChosung(book.title).includes(keyword);

const matchCategory=

currentCategory==='전체' ||

book.category===currentCategory ||

keyword!== '';

return matchKeyword && matchCategory;

});

if(filtered.length===0){

list.innerHTML=`
<div style="
text-align:center;
padding:30px;
color:#777;
">
검색 결과 없음
</div>
`;

return;

}

filtered.forEach(book=>{

const realIndex=
books.indexOf(book);

const div=document.createElement('div');

div.className='book-item';

div.onclick=()=>showBookDetail(book);

div.innerHTML=`

<div class="book-wrap">

${
book.image
?

`
<img
src="${book.image}"
class="book-image"
onerror="this.style.display='none'"
>
`

:

`
<div class="book-image"></div>
`
}

<div class="book-info">

<div class="book-title">

${book.isNew ? '⭐ ' : ''}

${book.title}

</div>

<div class="book-author">

${book.author}

</div>

<div class="book-tag">

${book.category}

</div>

<div class="book-location">

📍 ${book.location}

</div>

<div class="book-actions">

<button
class="small-btn location-btn"
onclick="event.stopPropagation();showLocation(
'${book.title}',
'${book.location}'
)">
위치
</button>

${admin ? `

<button
class="small-btn new-btn"
onclick="event.stopPropagation();toggleNew(${realIndex})"
>

${book.isNew ? '⭐ 신규해제' : '☆ 신규등록'}

</button>

<button
class="small-btn delete-btn"
onclick="event.stopPropagation();deleteBook(${realIndex})"
>

삭제

</button>

` : ''}

</div>

</div>

</div>

`;

list.appendChild(div);

});

}

function renderNewBooks(){

const area=
document.getElementById('newBooks');

area.innerHTML='';

books
.filter(book=>book.isNew)
.forEach(book=>{

const div=document.createElement('div');

div.className='new-card';

div.innerHTML=`

<div style="
font-weight:bold;
margin-bottom:5px;
">

📚 ${book.title}

</div>

<div style="
font-size:14px;
color:#666;
">

${book.author}

</div>

`;

div.onclick=()=>{

showLocation(
book.title,
book.location
);

};

area.appendChild(div);

});

}

function showBookDetail(book){

book.views = (book.views || 0) + 1;

saveBooks();

renderTopBooks();

alert(

'📚 도서 정보\n\n'+
'도서명 : '+book.title+'\n'+
'저자 : '+book.author+'\n'+
'카테고리 : '+book.category+'\n'+
'위치 : '+book.location+'\n'+
'조회수 : '+book.views

);

}

function renderTopBooks(){

const top=document.getElementById('topBooksList');

const sorted=[...books]
.sort((a,b)=>(b.views||0)-(a.views||0))
.slice(0,5);

let html='';

sorted.forEach((book,index)=>{

html+=`

<div style="
padding:8px 0;
border-bottom:1px solid #eee;
">

${index+1}위
${book.title}

(${book.views||0}회)

</div>

`;

});

top.innerHTML=html;

}

function renderStats(){

const total=books.length;

const newCount=
books.filter(b=>b.isNew).length;

document.getElementById('statsArea')
.innerHTML=`

총 도서 수 : ${total}권<br><br>

신규 도서 : ${newCount}권<br><br>

희망도서 신청 :
${wishBooks.length}건

`;

}

function addWishBook(){

const title=
document.getElementById('wishTitle').value.trim();

const author=
document.getElementById('wishAuthor').value.trim();

if(!title){

alert('도서명을 입력하세요');

return;

}

wishBooks.push({

title,
author,
date:new Date().toLocaleDateString()

});

localStorage.setItem(
'wishBooks',
JSON.stringify(wishBooks)
);

alert('희망도서 신청 완료');

document.getElementById('wishTitle').value='';
document.getElementById('wishAuthor').value='';

renderStats();

}

function showLocation(title,location){

const banner=
document.getElementById('banner');

banner.classList.add('show');

document.getElementById('locationText')
.innerHTML=
`📖 ${title}<br><br>${location}`;

document
.querySelectorAll('.cell')
.forEach(c=>c.classList.remove('highlight'));

const shelf=location.charAt(0);

const floor=
location.match(/\d+/)[0];

const target=
document.getElementById(`${shelf}-${floor}`);

if(target){

target.classList.add('highlight');

}

}

function closeBanner(){

document
.getElementById('banner')
.classList.remove('show');

}

function filterCategory(category,el){

currentCategory=category;

document
.querySelectorAll('.grid-btn')
.forEach(btn=>btn.classList.remove('active'));

el.classList.add('active');

renderBooks();

}

function toggleAdmin(){

const lockBtn=
document.getElementById('lockBtn');

if(!admin){

const id=prompt('ID');

if(id===null) return;

const pw=prompt('PW');

if(pw===null) return;

if(id==='admin' && pw==='1234'){

admin=true;

document
.getElementById('adminBox')
.style.display='block';

lockBtn.innerHTML='🔓';

renderBooks();

}else{

alert('로그인 실패');

}

}else{

admin=false;

document
.getElementById('adminBox')
.style.display='none';

lockBtn.innerHTML='🔒';

renderBooks();

}

}

function addBook(){

const title=
document.getElementById('title').value.trim();

const author=
document.getElementById('author').value.trim();

const category=
document.getElementById('category').value;

const shelf=
document.getElementById('shelf').value;

const floor=
document.getElementById('floor').value;

const image=
document.getElementById('imageUrl').value.trim();

if(!title || !author){

alert('도서명과 저자를 입력하세요');

return;

}

books.push({

title,
author,
category,
location:`${shelf}책장 ${floor}단`,
isNew:false,
views:0,
image:image

});

saveBooks();

renderBooks();

renderNewBooks();

renderStats();

document.getElementById('title').value='';
document.getElementById('author').value='';
document.getElementById('imageUrl').value='';

alert('등록 완료');

}

function deleteBook(index){

if(!confirm('삭제할까요?')) return;

books.splice(index,1);

saveBooks();

renderBooks();

renderNewBooks();

renderStats();

}

function toggleNew(index){

books[index].isNew=
!books[index].isNew;

saveBooks();

renderBooks();

renderNewBooks();

renderStats();

}

function downloadCSV(){

let csv='도서명,저자,위치,카테고리,이미지URL\n';

books.forEach(book=>{

csv+=
`${book.title},${book.author},${book.location},${book.category},${book.image || ''}\n`;

});

const blob=new Blob(
["\uFEFF"+csv],
{
type:'text/csv;charset=utf-8;'
}
);

const link=document.createElement('a');

const now=new Date();

const yy=
String(now.getFullYear()).slice(2);

const mm=
String(now.getMonth()+1).padStart(2,'0');

const dd=
String(now.getDate()).padStart(2,'0');

link.href=
URL.createObjectURL(blob);

link.download=
`${yy}${mm}${dd}_booklist.csv`;

link.click();

}

function uploadCSV(){

const fileInput=
document.getElementById('csvFile');

const file=fileInput.files[0];

if(!file){

alert('CSV 파일 선택');

return;

}

const reader=new FileReader();

reader.onload=function(e){

const text=e.target.result;

const lines=text.split('\n');

let uploadCount=0;

for(let i=1;i<lines.length;i++){

const row=lines[i].trim();

if(!row) continue;

const cols=row.split(',');

if(cols.length>=4){

books.push({

title:cols[0].trim(),
author:cols[1].trim(),
location:cols[2].trim(),
category:cols[3].trim(),
image: cols[4] ? cols[4].trim() : '',
isNew:false,
views:0

});

uploadCount++;

}

}

saveBooks();

renderBooks();

renderNewBooks();

renderStats();

renderTopBooks();

alert(uploadCount+'권 업로드 완료');

};

reader.readAsText(file,'utf-8');

}

document
.getElementById('search')
.addEventListener('input',renderBooks);

renderBooks();

renderNewBooks();

renderTopBooks();

renderStats();

</script>

</body>
</html>
