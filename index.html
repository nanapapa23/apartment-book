<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>효성해링턴 2단지 작은도서관</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">
📚 효성해링턴 2단지 작은도서관
</div>

type="text"
id="search"

<div class="section-title">
📖 신간도서
</div>

<div id="newBooks"></div>

<div class="category-wrap">

</button>

성인
</button>

data-category="어린이">

</button>

</button>

기타
</button>

</div>

</div>
