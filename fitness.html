<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fit.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<title>휘트니스 센터</title></head><body>
<div class="top-header"><h1>남율 효성해링턴 2단지 휘트니스 센터</h1></div>
<div class="section-title">공지사항</div>
<div id="notices"><div class="request-card">불러오는 중…</div></div>
<div class="section-title">이용 메뉴</div>
<div class="pick">
<a href="form.html?t=repair" class="pick-card"><i class="fa-solid fa-screwdriver-wrench"></i><b>수리요청</b><span>고장난 기구를 알려주세요</span></a>
<a href="form.html?t=equip" class="pick-card"><i class="fa-solid fa-dumbbell"></i><b>희망기구요청</b><span>들여왔으면 하는 기구</span></a>
<a href="form.html?t=suggest" class="pick-card"><i class="fa-solid fa-comment-dots"></i><b>건의사항</b><span>이용하며 느낀 점</span></a>
</div>
<script type="module">
import{list,nav,esc}from"./fit.js";
nav();
const box=document.getElementById("notices");
list("fit_notices").then(r=>{box.innerHTML=r.map(n=>`<div class="request-card"><b>${esc(n.title)}</b><div style="margin-top:6px;color:#555;white-space:pre-wrap">${esc(n.body)}</div></div>`).join("")||'<div class="request-card">등록된 공지가 없어요.</div>'}).catch(()=>{box.innerHTML='<div class="request-card">공지를 불러오지 못했어요.</div>'});
</script></body></html>
