<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="app.css"><script>document.documentElement.className=new URLSearchParams(location.search).get("s")=="lib"?"lib":"fit"</script><title>처리현황</title></head><body>
<header class="gh"><a class="back" id="back" href="#"><i class="fa-solid fa-chevron-left"></i> <span id="bk"></span></a><h1>처리현황</h1><p id="sub"></p></header>
<main>
<div class="seg" id="seg" style="margin-top:20px"></div>
<ul class="board" id="list"><li class="empty">불러오는 중…</li></ul>
</main>
<script type="module">
import{list,nav,esc,SPACES}from"./common.js";
const s=document.documentElement.className,$=id=>document.getElementById(id);
nav(s);$("back").href=SPACES[s].page;$("bk").textContent=SPACES[s].n;
$("sub").textContent=s=="lib"?"희망도서 신청의 진행 상황이에요":"수리요청과 희망기구추천의 진행 상황이에요";
const TABS=s=="lib"?[["bookreq","희망도서"]]:[["repair","수리요청"],["equip","희망기구추천"]];
const SC={수리접수:"prog",수리완료:"done",검토예정:"wait",구매예정:"prog",구매완료:"done",구매불가:"no"};
let all=[],k=TABS[0][0];
$("seg").style.gridTemplateColumns=`repeat(${TABS.length},1fr)`;
$("seg").innerHTML=TABS.map(([v,l],i)=>`<button type="button" data-k="${v}"${i?"":' class="on"'}>${l}</button>`).join("");
if(TABS.length<2)$("seg").hidden=true;
function draw(){$("list").innerHTML=all.filter(x=>x.type==k).map(x=>`<li><div class="line"><b>${esc(x.title)}</b><span class="st st-${SC[x.status]||"wait"}">${esc(x.status)}</span></div><time>${x.createdAt?.toDate?.().toLocaleDateString("ko-KR")||""}</time>${x.status=="구매불가"&&x.reason?`<p>사유: ${esc(x.reason)}</p>`:""}</li>`).join("")||'<li class="empty">접수된 내역이 없어요.</li>'}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{k=b.dataset.k;document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x==b));draw()});
list(s+"_board").then(r=>{all=r;draw()}).catch(()=>{$("list").innerHTML='<li class="empty">현황을 불러오지 못했어요.</li>'});
</script></body></html>
