<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="app.css"><script>var q=new URLSearchParams(location.search),tt=q.get("t");document.documentElement.className=q.get("s")=="lib"||tt=="volunteer"||tt=="bookreq"?"lib":"fit"</script><title>접수</title></head><body>
<header class="gh"><a class="back" id="back" href="#"><i class="fa-solid fa-chevron-left"></i> <span id="bk"></span></a><h1 id="h"></h1><p id="sub"></p></header>
<main>
<form id="f"><div id="picker"></div><div id="fields"></div><button class="go" id="go">접수하기</button><div class="msg" id="msg"></div></form>
<a class="act" id="stl" href="status.html?s=lib" hidden style="margin-top:20px"><span class="ic"><i class="fa-solid fa-clipboard-list"></i></span><div><b>신청 현황 보기</b><span>신청된 도서와 처리 상태를 확인해요</span></div><i class="fa-solid fa-chevron-right"></i></a>
</main>
<script type="module">
import{put,newId,list,nav,esc,TYPES,SPACES,bTitle}from"./common.js";
const F={
volunteer:{sub:"도서관을 함께 가꿀 봉사자를 모집합니다",col:"volunteer_applications",hint:"입력하신 개인정보와 신청 내용은 관리자만 열람할 수 있어요.",f:[["name","성함","text"],["phone","연락처 (예: 010-1234-5678)","tel"],["dong","거주하시는 동","select",["201동","202동","203동","204동","205동","206동"]],["ho","호수 (예: 104호)","text"],["type","참여 형태","select",["매주 가능","원데이만 가능"]],["dayType","평일 / 주말","select",["평일","주말"]],["date","봉사 희망 날짜","date"],["startTime","봉사 시작 시간","select",[]],["duration","봉사 희망 시간 (최소 2시간 단위)","select",["2시간","4시간","6시간","8시간"]],["comment","기타 참고사항 (선택)","textarea",0]]},
bookreq:{sub:"원하는 도서를 신청해주세요",col:"book_requests",hint:"입력하신 동호수는 관리자만 볼 수 있습니다.",f:[["dongHo","동호수 (예: 101동 102호)","text"],["title","책 제목","text"],["author","저자 (선택)","text",0],["publisher","출판사 (선택)","text",0],["comment","기타 의견 (선택)","textarea",0]]},
repair:{sub:"고장난 기구와 증상을 알려주세요",pick:1,f:[["name","이름(선택)","text",0],["detail","증상","textarea"]]},
equip:{sub:"들여왔으면 하는 기구를 추천해 주세요",f:[["item","추천 기구","text"],["memo","추천 이유(선택)","textarea",0]]},
suggest:{sub:"이용하며 느낀 점을 남겨주세요",f:[["subject","제목","text"],["memo","내용","textarea"],["name","이름(선택)","text",0]]}};
const GUIDE={
volunteer:`<h2>자원봉사 참여 안내</h2><div class="welcome">우리 아파트 입주민 누구나 신청 가능합니다!</div><h3>봉사 모집 일정</h3><ul><li><b>평일</b> 오후 6시 이후 ~ 오후 10시까지</li><li><b>주말</b> 오전 10시 이후 언제든지 가능</li><li>최소 신청 시간은 <b>2시간 단위</b>입니다.</li></ul><h3>참여 방식</h3><p>지속적인 정기 봉사뿐만 아니라, 주말을 이용한 <b>원데이(일회성) 봉사</b>도 언제나 대환영합니다.</p><h3>부담 없이 함께해주세요</h3><p>작은도서관 봉사는 단순히 해당 시간에 자리를 지켜주시는 일입니다. <b>혼자 또는 가족들과 함께 원하는 책을 읽으며</b> 편안하게 시간을 보내시면 됩니다.</p><p class="small">※ 아이들만 있을 경우 가벼운 뒷정리를 지도하고, 비품으로 장난치는 것을 예방하기 위한 목적이므로 봉사에 대해 전혀 부담을 느끼지 않으셔도 좋습니다.</p>`,
bookreq:`<h2>희망도서 신청 안내</h2><p><b>정치, 종교, 투자 관련 및 특정기업 시험책</b>은 요청하여도 <b>구매가 불가</b>합니다.</p><p>많은 입주민이 함께 읽을 수 있는 <b>베스트셀러 / 자기계발</b> 등에 관련된 책 위주로 신청 부탁드립니다.</p>`};
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search),k=F[Q.get("t")]?Q.get("t"):"suggest",s=document.documentElement.className,c=F[k],T=TYPES[k],SP=SPACES[s];
document.title=T.l;$("h").textContent=T.l;$("sub").textContent=c.sub;$("back").href=SP.page;$("bk").textContent=SP.n;$("stl").hidden=k!="bookreq";nav(s);
$("fields").innerHTML=(c.hint?`<small class="hint" style="margin-top:14px">${c.hint}</small>`:"")+c.f.map(([n,l,ty,r])=>`<label for="f_${n}">${l}</label>`+(ty=="textarea"?`<textarea id="f_${n}" ${r===0?"":"required"}></textarea>`:ty=="select"?`<select id="f_${n}" required><option value="">선택하세요</option>${r.map(x=>`<option>${x}</option>`).join("")}</select>`:`<input id="f_${n}" type="${ty}" ${r===0?"":"required"}>`)).join("");
if(GUIDE[k]){document.body.insertAdjacentHTML("beforeend",`<div class="sheet on" id="guide"><div>${GUIDE[k]}<button class="go" type="button" id="gc">확인했습니다</button></div></div>`);$("gc").onclick=()=>$("guide").remove()}
if(k=="volunteer"){
const H={평일:[18,19,20,21,22],주말:[10,11,12,13,14,15,16,17,18]},st=$("f_startTime");
st.innerHTML='<option value="">평일/주말을 먼저 선택해주세요</option>';
$("f_dayType").onchange=e=>{st.innerHTML='<option value="">시작 시간 선택</option>'+(H[e.target.value]||[]).map(h=>`<option>${String(h).padStart(2,"0")}:00</option>`).join("")};
$("f_date").min=new Date().toISOString().slice(0,10)}
let sel=null,grp=null,eq=[],ready;
if(c.pick){
ready=list("fit_equipment").then(r=>eq=r).catch(()=>{});
$("picker").innerHTML=`<label>기구 종류</label><div class="seg">${["유산소기구","웨이트머신","기타"].map(g=>`<button type="button" data-g="${g}">${g}</button>`).join("")}</div><div id="eqWrap" hidden><label>기구 선택</label><div class="tiles" id="tiles"></div><img id="eqBig" class="big" alt="" hidden></div>`;
document.addEventListener("click",async e=>{
const b=e.target.closest("[data-g]");
if(b){await ready;grp=b.dataset.g;sel=null;$("eqBig").hidden=true;$("eqWrap").hidden=false;document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("on",x==b));
$("tiles").innerHTML=eq.filter(x=>x.group==grp).map(x=>`<button type="button" class="tile" data-e="${esc(x.id)}">${x.photo?`<img src="${esc(x.photo)}" alt="">`:'<div class="ph">사진 없음</div>'}<span>${esc(x.name)}</span></button>`).join("")||'<div class="empty">등록된 기구가 없어요. 증상에 기구 이름을 적어주세요.</div>'}
const p=e.target.closest("[data-e]");
if(p){sel=eq.find(x=>x.id==p.dataset.e);document.querySelectorAll("[data-e]").forEach(x=>x.classList.toggle("on",x==p));$("eqBig").hidden=!sel.photo;if(sel.photo)$("eqBig").src=sel.photo}})}
$("f").onsubmit=async e=>{e.preventDefault();
if(c.pick){if(!grp)return alert("기구 종류를 선택하세요.");if(!sel&&eq.some(x=>x.group==grp))return alert("기구를 선택하세요.")}
const d={type:k};if(T.st)d.status=T.st[0];c.f.forEach(([n])=>d[n]=$("f_"+n).value.trim());
if(k=="bookreq")d.reason="";
if(c.pick){d.group=grp;d.equipment=sel?sel.name:"";d.equipmentId=sel?sel.id:""}
$("go").disabled=true;
try{const cl=c.col||s+"_submissions",id=newId(cl);await put(cl,id,c.col?{...d,createdAt:new Date().toISOString()}:d,c.col?1:0);
if(T.board)try{await put(s+"_board",id,{type:k,title:bTitle(d),group:d.group||"",status:d.status,...(k=="bookreq"?{author:d.author||"",publisher:d.publisher||""}:{})})}catch{}
$("f").reset();sel=null;document.querySelectorAll(".on[data-e]").forEach(x=>x.classList.remove("on"));if(c.pick)$("eqBig").hidden=true;$("msg").textContent="접수되었어요. 감사합니다."}
catch{$("msg").textContent="접수에 실패했어요. 잠시 후 다시 시도해 주세요."}
$("go").disabled=false};
</script></body></html>
