<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fit.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<title>접수</title></head><body>
<div class="top-header"><h1 id="h"></h1></div>
<div id="picker"></div>
<form id="f" class="admin-card"><div id="fields"></div><button class="save-btn" id="go">접수하기</button><div class="msg" id="msg"></div></form>
<script type="module">
import{add,list,nav,esc}from"./fit.js";
nav();
const T={
repair:{title:"수리요청",pick:1,f:[["name","이름(선택)","text",0],["detail","증상","textarea"]]},
equip:{title:"희망기구요청",f:[["item","희망 기구","text"],["memo","사유","textarea",0]]},
suggest:{title:"건의사항",f:[["subject","제목","text"],["memo","내용","textarea"],["name","이름(선택)","text",0]]}};
const t=new URLSearchParams(location.search).get("t"),c=T[t]||T.suggest,$=id=>document.getElementById(id);
document.title=c.title;$("h").textContent=c.title;
$("fields").innerHTML=c.f.map(([k,l,ty,r])=>`<label>${l}</label>`+(ty=="textarea"?`<textarea id="f_${k}" ${r===0?"":"required"}></textarea>`:`<input id="f_${k}" type="${ty}" ${r===0?"":"required"}>`)).join("");
let sel=null,grp=null,eq=[],ready;
if(c.pick){
ready=list("fit_equipment").then(r=>eq=r).catch(()=>{});
$("picker").innerHTML=`<div class="section-title">1. 기구 종류</div><div class="category-grid">${[["유산소기구","fa-person-running"],["웨이트머신","fa-dumbbell"],["기타","fa-layer-group"]].map(([g,i])=>`<div class="category-item" data-g="${g}"><i class="fa-solid ${i}"></i><span>${g}</span></div>`).join("")}</div><div class="section-title">2. 기구 선택</div><div id="eqList"><div class="request-card">종류를 먼저 선택하세요.</div></div><img id="eqBig" class="big" hidden>`;
document.addEventListener("click",async e=>{
const k=e.target.closest("[data-g]");
if(k){await ready;grp=k.dataset.g;sel=null;$("eqBig").hidden=true;document.querySelectorAll("[data-g]").forEach(x=>x.classList.toggle("active",x==k));
$("eqList").innerHTML=eq.filter(x=>x.group==grp).map(x=>`<div class="book-item pickable" data-e="${esc(x.id)}"><div style="flex:1;font-weight:700">${esc(x.name)}</div>${x.photo?`<img class="thumb" src="${esc(x.photo)}">`:""}</div>`).join("")||'<div class="request-card">등록된 기구가 없어요. 증상에 기구 이름을 적어주세요.</div>'}
const p=e.target.closest("[data-e]");
if(p){sel=eq.find(x=>x.id==p.dataset.e);document.querySelectorAll("[data-e]").forEach(x=>x.classList.toggle("sel",x==p));$("eqBig").hidden=!sel.photo;if(sel.photo)$("eqBig").src=sel.photo}})}
$("f").onsubmit=async e=>{e.preventDefault();
if(c.pick){if(!grp)return alert("기구 종류를 선택하세요.");if(!sel&&eq.some(x=>x.group==grp))return alert("기구를 선택하세요.")}
const d={type:t,status:"접수"};c.f.forEach(([k])=>d[k]=$("f_"+k).value.trim());
if(c.pick){d.group=grp;d.equipment=sel?sel.name:"";d.equipmentId=sel?sel.id:""}
$("go").disabled=true;
try{await add("fit_submissions",d);$("f").reset();sel=null;document.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));if(c.pick)$("eqBig").hidden=true;$("msg").textContent="접수되었어요. 감사합니다."}
catch{$("msg").textContent="접수에 실패했어요. 잠시 후 다시 시도해 주세요."}
$("go").disabled=false};
</script></body></html>
