<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자원봉사 신청</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    .vol-select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 12px;
        margin-bottom: 10px;
        font-size: 14px;
        background-color: white;
    }
    .vol-label {
        font-size: 13px;
        font-weight: bold;
        color: #555;
        margin-bottom: 5px;
        display: block;
        padding-left: 5px;
    }
</style>
</head>
<body>

<div class="admin-header">
    <div>
        <h1>도서관 자원봉사 신청</h1>
        <p>도서관을 함께 가꾸어갈 봉사자를 모집합니다.</p>
    </div>
    <a href="index.html" class="logout-btn">홈으로</a>
</div>

<div class="admin-card">
    <h2>봉사 신청서 작성</h2>
    <p style="font-size: 12px; color: #e53935; margin-top: -5px; margin-bottom: 15px; padding-left: 5px; font-weight: 600;">
        * 입력하신 모든 개인정보와 신청 내용은 관리자만 열람 가능합니다.
    </p>

    <input type="text" id="volName" placeholder="성함">
    <input type="tel" id="volPhone" placeholder="연락처 (예: 010-1234-5678)">

    <!-- 동(201동~206동) 선택 및 호수 입력 -->
    <select id="volDong" class="vol-select">
        <option value="">-- 거주하시는 동 선택 --</option>
        <option value="201동">201동</option>
        <option value="202동">202동</option>
        <option value="203동">203동</option>
        <option value="204동">204동</option>
        <option value="205동">205동</option>
        <option value="206동">206동</option>
    </select>
    <input type="text" id="volHo" placeholder="호수 (예: 104호)">

    <!-- 참여 구분 -->
    <select id="volType" class="vol-select">
        <option value="">-- 참여 형태 선택 --</option>
        <option value="매주 가능">매주 가능 (정기 봉사)</option>
        <option value="원데이만 가능">원데이만 가능 (일회성 봉사)</option>
    </select>

    <!-- 날짜 선택 -->
    <label class="vol-label">봉사 희망 날짜</label>
    <input type="date" id="volDate" style="margin-bottom: 15px;">

    <!-- 봉사 시작 시간 선택 (드롭다운) -->
    <label class="vol-label">봉사 시작 시간</label>
    <select id="volStartTime" class="vol-select">
        <option value="">-- 시작 시간 선택 --</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="12:00">12:00</option>
        <option value="13:00">13:00</option>
        <option value="14:00">14:00</option>
        <option value="15:00">15:00</option>
        <option value="16:00">16:00</option>
        <option value="17:00">17:00</option>
        <option value="18:00">18:00</option>
    </select>

    <!-- 봉사 진행 시간 선택 (드롭다운) -->
    <label class="vol-label">봉사 희망 시간 (최소 2시간 단위)</label>
    <select id="volDuration" class="vol-select">
        <option value="">-- 진행 시간 선택 --</option>
        <option value="2시간">2시간 동안</option>
        <option value="4시간">4시간 동안</option>
        <option value="6시간">6시간 동안</option>
        <option value="8시간">8시간 동안</option>
    </select>

    <textarea id="volComment" placeholder="기타 참고사항 및 문의사항 (선택)" style="
        width:100%;
        height:80px;
        padding:12px;
        border:1px solid #ddd;
        border-radius:12px;
        margin-bottom:15px;
        resize:none;
    "></textarea>

    <button id="volunteerBtn" class="save-btn">봉사 신청하기</button>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>홈</span>
    </a>
    <a href="volunteer.html" class="nav-item active">
        <i class="fa-solid fa-hands-helping"></i>
        <span>봉사신청</span>
    </a>
    <a href="request.html" class="nav-item">
        <i class="fa-solid fa-book-bookmark"></i>
        <span>희망도서</span>
    </a>
    <a href="admin-login.html" class="nav-item">
        <i class="fa-solid fa-user-shield"></i>
        <span>관리자</span>
    </a>
</div>

<script type="module" src="volunteer.js"></script>
</body>
</html>
