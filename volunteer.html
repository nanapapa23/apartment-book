<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자원봉사 신청</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="admin-header">
<div>
<h1>자원봉사 신청</h1>
<p>도서관을 위한 따뜻한 손길을 기다립니다</p>
</div>
<a href="index.html" class="logout-btn">홈으로</a>
</div>

<div class="admin-card">
<h2>봉사자 정보 입력</h2>

<input type="text" id="volName" placeholder="성함">
<input type="tel" id="volPhone" placeholder="연락처 (예: 010-1234-5678)">

<!-- 동/호수 입력란 -->
<div style="display: flex; gap: 10px; margin-bottom: 10px;">
    <select id="volDong" style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 12px;">
        <option value="">동 선택</option>
        <option value="201동">201동</option>
        <option value="202동">202동</option>
        <option value="203동">203동</option>
        <option value="204동">204동</option>
        <option value="205동">205동</option>
        <option value="206동">206동</option>
    </select>
    <input type="text" id="volHo" placeholder="호수 (수기입력)" style="flex: 1; margin-bottom: 0;">
</div>

<!-- 구분 선택 -->
<div style="margin-bottom: 15px; padding: 5px;">
    <label style="margin-right: 15px; font-weight: 600;">
        <input type="radio" name="volType" value="매주 가능" checked style="margin-right: 5px;"> 매주 가능
    </label>
    <label style="font-weight: 600;">
        <input type="radio" name="volType" value="원데이만 가능" style="margin-right: 5px;"> 원데이만 가능
    </label>
</div>

<!-- 날짜 및 시간 설정 -->
<div style="margin-bottom: 10px;">
    <label style="font-size: 13px; color: #666; display: block; margin-bottom: 4px; padding-left: 4px;">희망 봉사 날짜</label>
    <input type="date" id="volDate">
</div>

<div style="display: flex; gap: 10px; margin-bottom: 5px;">
    <div style="flex: 1;">
        <label style="font-size: 13px; color: #666; display: block; margin-bottom: 4px; padding-left: 4px;">시작 시간</label>
        <input type="time" id="volTime" style="margin-bottom: 0;">
    </div>
    <div style="flex: 1;">
        <label style="font-size: 13px; color: #666; display: block; margin-bottom: 4px; padding-left: 4px;">봉사 시간 (최소 2시간)</label>
        <input type="number" id="volDuration" min="2" value="2" placeholder="시간 단위" style="margin-bottom: 0;">
    </div>
</div>
<p style="font-size: 12px; color: #e53935; margin-bottom: 15px; padding-left: 5px; font-weight: 600;">
    * 봉사 신청은 최소 2시간 단위로만 신청 가능합니다.<br>
    * 입력하신 모든 인적사항 및 일정은 관리자만 안전하게 확인합니다.
</p>

<button id="volunteerBtn" class="save-btn" style="background-color: #1e88e5;">신청하기</button>
</div>

<div class="bottom-nav">
<a href="index.html" class="nav-item">
<i class="fa-solid fa-house"></i>
<span>홈</span>
</a>
<a href="volunteer.html" class="nav-item active">
<i class="fa-solid fa-hand-holding-heart"></i>
<span>봉사신청</span>
</a>
<a href="request.html" class="nav-item">
<i class="fa-solid fa-book-bookmark"></i>
<span>희망도서</span>
</a>
<a href="admin-login.html" class="nav-item">
<i class="fa-solid fa-user-shield"></i>
<span>관리자</span>
</a>
</div>

<script type="module" src="volunteer.js"></script>
</body>
</html>
